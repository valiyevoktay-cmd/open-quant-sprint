[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-cointegration"
version = "0.1.0"
description = "Rolling cryptocurrency cointegration and hedge-ratio analysis"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas","matplotlib", "pyarrow"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
